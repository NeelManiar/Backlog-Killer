name: Backlog Killer v0.3 checks
on:
  push:
    branches:
      - codex/bk-first-implementation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Android bundle export
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_OFFLINE: '1'
        run: npx expo export --platform android
      - name: Web bundle export
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_OFFLINE: '1'
        run: npx expo export --platform web
