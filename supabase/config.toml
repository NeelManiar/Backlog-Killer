project_id = "backlog-killer"

# Local/deploy configuration template. Apply/verify hosted settings in the dashboard.
[auth]
enabled = true
site_url = "http://localhost:8081"
# No magic-link session extraction: the app verifies email codes through Supabase.
additional_redirect_urls = []
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.email.template.confirmation]
subject = "Your BK email code"
content_path = "./templates/code.html"

[auth.email.template.magic_link]
subject = "Your BK sign-in code"
content_path = "./templates/code.html"
